openapi: 3.0.3
info:
  title: Pets API
  version: 1.0.0
tags:
  - name: Pets
paths:
  /pets:
    get:
      tags:
        - Pets
      operationId: listPets
      summary: List pets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
      properties:
        id:
          type: string
