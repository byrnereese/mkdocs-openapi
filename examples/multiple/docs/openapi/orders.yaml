openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
tags:
  - name: Orders
paths:
  /orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
components:
  schemas:
    Order:
      type: object
      required:
        - id
      properties:
        id:
          type: string
