[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-openapi"
version = "0.2.2"
description = "Generate predictable MkDocs API reference pages from OpenAPI specifications"
keywords = ["mkdocs", "openapi", "documentation"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Byrne Reese" },
]
dependencies = [
  "mkdocs>=1.6",
  "pymdown-extensions>=10.2",
  "PyYAML>=6",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: MkDocs",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "mkdocs-material>=9.6",
  "pytest>=8",
]

[project.entry-points."mkdocs.plugins"]
openapi = "mkdocs_openapi.plugin:OpenAPIPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_openapi"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/CHANGELOG.md",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/byrnereese/mkdocs-openapi"
Repository = "https://github.com/byrnereese/mkdocs-openapi"
Issues = "https://github.com/byrnereese/mkdocs-openapi/issues"
